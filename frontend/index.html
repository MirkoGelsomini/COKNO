<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cokno — Multi-source Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Cokno</h1>

    <form id="search-form">
      <div class="search-bar">
        <input type="text" id="query-input" placeholder="Search anything…" autocomplete="off" />
        <label class="expand-toggle">
          <input type="checkbox" id="expand-checkbox" />
          <span>Expand query</span>
        </label>
        <label class="expand-toggle safe-toggle">
          <input type="checkbox" id="safe-checkbox" checked />
          <span>Safe Search</span>
        </label>
        <button type="submit">Search</button>
      </div>
    </form>

    <nav class="category-tabs">
      <button class="tab active" data-category="">All</button>
      <button class="tab" data-category="images">Images</button>
      <button class="tab" data-category="videos">Videos</button>
      <button class="tab" data-category="gifs">GIFs</button>
      <button class="tab" data-category="models3d">3D Models</button>
      <button class="tab" data-category="texts">Texts</button>
    </nav>
  </header>

  <main>
    <section id="trail-section" class="hidden">
      <div id="trail-header">
        <h2>Percorso di conoscenza</h2>
        <button id="trail-clear" class="trail-clear-btn">Cancella percorso</button>
      </div>
      <p class="trail-hint">I concetti che hai esplorato in questa sessione, e come sei arrivato da uno all'altro.</p>
      <div id="trail-path"></div>
    </section>

    <section id="meta-section" class="hidden">
      <div id="query-info"></div>
      <div id="source-badges"></div>
      <div id="related-tags"></div>
    </section>

    <section id="graph-section" class="hidden">
      <div id="graph-header">
        <h2>Knowledge Map</h2>
        <div id="coverage-badge"></div>
      </div>
      <div id="graph-canvas">
        <svg id="graph-edges"></svg>
      </div>
      <div id="graph-detail" class="hidden"></div>
    </section>

    <section id="results-section">
      <div id="status-message"></div>
      <div id="results-grid"></div>
      <div id="pagination" class="hidden"></div>
    </section>
  </main>

  <div id="result-modal" class="modal hidden">
    <div id="modal-backdrop"></div>
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-media"></div>
      <div id="modal-body">
        <span id="modal-source" class="card-source"></span>
        <h2 id="modal-title"></h2>
        <p id="modal-author" class="card-author"></p>
        <p id="modal-desc" class="card-desc"></p>
        <div id="modal-tags" class="card-tags"></div>
        <a id="modal-open-link" href="#" target="_blank" rel="noopener" class="modal-open-btn">Apri sorgente ↗</a>
      </div>
      <div id="modal-related" class="hidden">
        <h3>Risultati correlati</h3>
        <div id="modal-related-grid"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
